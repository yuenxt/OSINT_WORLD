name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04

    defaults:
      run:
        working-directory: OSINT_WORLD_ANDROID

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Prepare Android SDK for Buildozer
        shell: bash
        run: |
          set -euxo pipefail

          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "SDK=$SDK"

          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-31" \
            "build-tools;33.0.2"

          # Buildozer expects the old tools/bin/sdkmanager location.
          mkdir -p "$SDK/tools/bin"
          ln -sf "$(command -v sdkmanager)" "$SDK/tools/bin/sdkmanager"

          # Verify AIDL exists where Buildozer checks it.
          test -x "$SDK/build-tools/33.0.2/aidl"
          "$SDK/build-tools/33.0.2/aidl" || test $? -eq 1

          # IMPORTANT: tell Buildozer to use this SDK.
          python - <<'PY'
          from pathlib import Path
          import os, re

          p = Path("buildozer.spec")
          text = p.read_text(encoding="utf-8")
          sdk = os.environ.get("ANDROID_SDK_ROOT") or os.environ["ANDROID_HOME"]

          if re.search(r"(?m)^android\.sdk_path\s*=", text):
              text = re.sub(
                  r"(?m)^android\.sdk_path\s*=.*$",
                  "android.sdk_path = " + sdk,
                  text,
              )
          elif re.search(r"(?m)^#\s*android\.sdk_path\s*=", text):
              text = re.sub(
                  r"(?m)^#\s*android\.sdk_path\s*=.*$",
                  "android.sdk_path = " + sdk,
                  text,
              )
          else:
              marker = "[app]"
              text = text.replace(
                  marker,
                  marker + "\nandroid.sdk_path = " + sdk,
                  1,
              )

          text = re.sub(
              r"(?m)^#\s*android\.accept_sdk_license\s*=.*$",
              "android.accept_sdk_license = True",
              text,
          )
          if not re.search(r"(?m)^android\.accept_sdk_license\s*=", text):
              text = text.replace(
                  "[app]",
                  "[app]\nandroid.accept_sdk_license = True",
                  1,
              )

          # Use the maintained p4a branch if the spec has the old setting.
          text = re.sub(
              r"(?m)^#\s*p4a\.branch\s*=\s*master\s*$",
              "p4a.branch = develop",
              text,
          )

          p.write_text(text, encoding="utf-8")
          print("Using SDK:", sdk)
          print("buildozer.spec updated")
          PY

          grep -E "^(android\.sdk_path|android\.accept_sdk_license|p4a\.branch)" buildozer.spec

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            automake \
            libltdl-dev \
            build-essential \
            libstdc++6 \
            aidl

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade buildozer

      - name: Clean old Buildozer cache
        run: |
          rm -rf .buildozer
          rm -rf ~/.buildozer

      - name: Build APK
        run: |
          buildozer -v android debug

      - name: Show APK
        run: |
          find bin -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OSINT_WORLD_APK
          path: OSINT_WORLD_ANDROID/bin/*.apk
          if-no-files-found: error
